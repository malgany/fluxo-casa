<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fef7ff" />
    <meta
      name="description"
      content="Site oficial do Fluxo Casa, aplicativo de organizacao financeira domestica publicado por Malgany."
    />
    <meta name="application-name" content="Fluxo Casa" />
    <meta name="publisher" content="Malgany" />
    <link rel="canonical" href="https://fluxo-casa-phi.vercel.app/" />
    <meta property="og:site_name" content="Fluxo Casa" />
    <meta property="og:title" content="Fluxo Casa" />
    <meta
      property="og:description"
      content="Aplicativo de organizacao financeira domestica publicado por Malgany."
    />
    <meta property="og:url" content="https://fluxo-casa-phi.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fluxo Casa" />
    <meta name="format-detection" content="telephone=no,email=no,address=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Fluxo Casa</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("fluxo-casa-theme");
          const appliedTheme = theme === "dark" ? "dark" : "light";
          document.documentElement.dataset.theme = appliedTheme;
          document.documentElement.dataset.themeVariant = theme || "light";
          document.documentElement.style.colorScheme = appliedTheme;
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.dataset.themeVariant = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
